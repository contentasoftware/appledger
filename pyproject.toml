[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "appledger"
version = "0.2.1"
description = "The ledger for the AI app explosion: honest security checks, in plain language, for apps your people build with AI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Contenta Software" }]
keywords = ["security", "mcp", "claude", "codex", "trivy", "opengrep", "vibe-coding", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.20,<2",
    "pyyaml>=6",
    "packaging>=23",
    "anyio>=4",
]

[project.urls]
Homepage = "https://appledger.net/"
Repository = "https://github.com/contentasoftware/appledger"
Privacy = "https://appledger.net/privacy.html"

[project.scripts]
appledger = "appledger.scanner:main"
appledger-mcp = "appledger.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/appledger"]

[tool.hatch.build.targets.sdist]
include = ["src/appledger", "README.md", "LICENSE", "pyproject.toml"]
